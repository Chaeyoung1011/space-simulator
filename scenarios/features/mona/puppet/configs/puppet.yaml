mona:
  enabled: True              # 모드 ON → 연결되면 모나로 명령 전송, 아니면 시뮬레이터로 폴백
  udp_port: 9999
  distance_scale: 1.0
  battery_listen_port: 5005  # Arduino가 배터리 데이터를 전송하는 UDP 포트
  robots:
  - agent_id: 0
    host: 192.168.0.47   # MONA #1 IP
    port: 8080           # MONA #1 포트
  - agent_id: 1
    host: 192.168.0.56   # MONA #2 IP
    port: 8080           # MONA #2 포트
  - agent_id: 2
    host: 192.168.0.46   # MONA #3 IP
    port: 8080           # MONA #3 포트
  - agent_id: 3
    host: 192.168.0.48   # MONA #4 IP
    port: 8080           # MONA #4 포트
  - agent_id: 4
    host: 192.168.0.58   # MONA #5 IP
    port: 8080           # MONA #5 포트
  - agent_id: 5
    host: 192.168.0.55   # MONA #6 IP
    port: 8080           # MONA #6 포트
  - agent_id: 6
    host: 192.168.0.60   # MONA #7 IP
    port: 8080           # MONA #7 포트
  - agent_id: 7
    host: 192.168.0.59   # MONA #8 IP
    port: 8080           # MONA #8 포트
  - agent_id: 8
    host: 192.168.0.62   # MONA #9 IP
    port: 8080           # MONA #9 포트

scenario:
  environment: scenarios.features.mona.puppet

decision_making:
  plugin: plugins.hungarian.dec_hungarian.DistributedHungarian
  # plugin: plugins.cbba.cbba.CBBA

  # ── Phase 1: Super-Task allocation via GRAPE ─────────────────────
  GRAPE:
    cost_weight_factor: 0.03
    social_inhibition_factor: 0.0
    initialize_partition: Distance
    reinitialize_partition_on_completion: Distance

  # ── Phase 2: Regular-Task allocation via DistributedHungarian ────
  Hungarian:
    task_reward_discount_factor: 0.999
    epsilon: 1e-10
    dummy_cost: 0.0

  # ── Phase 2 (alternative): Regular-Task allocation via CBBA ──────
  # CBBA:
  #   max_tasks_per_agent: 1
  #   task_reward_discount_factor: 0.999
  #   winning_bid_cancel: True
  #   acceptable_empty_bundle_duration: 500   # sec


agents:
  behavior_tree_xml: default_bt.xml
  quantity: 9
  fixed_batteries:   # Initial battery % per agent (optional; omit to use random 40~90%)
    - 100.0   # agent 0
    - 95.0   # agent 1
    - 90.0   # agent 2
    - 85.0   # agent 3
    - 80.0   # agent 4
    - 50.0   # agent 5
    - 45.0   # agent 6
    - 40.0   # agent 7
    - 35.0   # agent 8
  locations:
    x_min: 0
    x_max: 1340
    y_min: 0
    y_max: 740
    non_overlap_radius: 0
  max_speed: 1.0
  max_accel: 1.0
  max_angular_speed: 0.04
  target_approaching_radius: 50
  work_rate: 1.5  # work rate for each agent (per 1.0/simulation.sampling_freq)
  max_task_amount_done_per_agent: 30.0  # Once an agent's task_amount_done reaches this, it stops bidding (1:1 assignment)
  communication_radius: 3000 # 0 represents "global"
  situation_awareness_radius: 2000 # 0 represents "global"
  random_exploration_duration: 1500.0 # sec
  use_rotation_shim: True  # True: rotate-then-move; False: standard steering

super_tasks:
  groups:
    - tasks: [0, 1, 2]           # Super Task 0  (3 tasks)
    - tasks: [3, 4, 5, 6, 7, 8] # Super Task 1  (6 tasks)

tasks:
  quantity: 9
  fixed_positions:
    - [450, 120]   # task 0 - top of stem
    - [450, 370]   # task 1 - middle of stem
    - [450, 620]   # task 2 - bottom of stem
